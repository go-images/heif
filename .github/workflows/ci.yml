name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Build, vet, race-test and enforce 100% statement coverage of the package on three OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test with coverage
        shell: bash # PowerShell splits -coverpkg=github.com/... at the first dot
        run: go test -timeout 20m -race -coverpkg=github.com/go-images/heif -coverprofile=cover.out ./...
      - name: 100% statement coverage of the package
        run: go run ./internal/covergate cover.out

  # Hostile inputs are refused under a memory limit: a refusal that allocates the
  # size the file claims would be killed here.
  bombs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Bomb tests under GOMEMLIMIT
        env:
          GOMEMLIMIT: 256MiB
        run: go test -count=1 -run 'TestBombs|TestGridTileBudget|TestLimitsOfStructure' -v .

  # A short fuzz run from the committed corpus.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Fuzz Decode
        run: go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime 60s .

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: govulncheck ./...
